<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>کوییز کلاسی - بازی</title>
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="styles/game.css">
</head>
<body>

  <div id="screen-lock" class="screen-lock" hidden></div>

  <div id="timer-badge" class="timer-badge" hidden>
    <span id="timer-text">--:--</span>
  </div>

  <div id="progress-badge" class="progress-badge" hidden>
    <span id="progress-text"></span>
  </div>

  <div class="game-shell">

    <div class="question-section" id="question-section">
      <div class="question-container">
        <p id="question-text" class="question-text">
          <span id="part-1"></span><span id="blank" class="blank" data-default="...">...</span><span id="part-2"></span>
        </p>
      </div>
    </div>

    <div class="options-section">
      <h2 class="options-title">گزینه را بکشید و رها کنید</h2>
      <div class="options-container" id="options-container">
        <div class="option-item float-1" draggable="true" data-option-number="1"></div>
        <div class="option-item float-2" draggable="true" data-option-number="2"></div>
        <div class="option-item float-3" draggable="true" data-option-number="3"></div>
        <div class="option-item float-4" draggable="true" data-option-number="4"></div>
      </div>
    </div>

    <div class="action-buttons">
      <button id="btn-clear" class="btn btn-secondary">پاک کردن</button>
      <button id="btn-next" class="btn btn-primary">ثبت پاسخ</button>
    </div>

  </div>

  <!-- روی موبایل در حالت عمودی، این بخش به‌جای بازی نمایش داده می‌شود -->
  <div class="rotate-overlay" id="rotate-overlay">
    <div class="rotate-icon" aria-hidden="true"></div>
    <p>برای ادامه‌ی بازی، گوشی را به حالت افقی بچرخان</p>
    <p class="rotate-subtext">این صفحه برای نمایش افقی طراحی شده است</p>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
