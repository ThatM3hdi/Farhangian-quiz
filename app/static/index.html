<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول امتیازات</title>
    <link rel="stylesheet" href="styles/index.css">
</head>
<body>

<div class="addr">
    <div id="qrcode"></div>
    <p>برای ورود به بازی اسکن کنید</p>
    <div id="timer-badge" class="timer-badge" hidden>
        <span class="hourglass-icon" aria-hidden="true">⏳</span>
        <span id="timer-text">--:--</span>
    </div>
</div>

<div class="leaderboaed">
    <h1>جدول امتیازات</h1>
    <div class="leaderboard-wrapper">
        <table class="leaderboard-table">
            <!-- سربرگ جدول -->
            <thead>
                <tr>
                    <th class="col-rank">رتبه</th>
                    <th class="col-name">نام</th>
                    <th class="col-accuracy">دقت</th>
                </tr>
            </thead>
            
            <!-- بدنه جدول: کاملاً توسط js/leaderboard.js پر می‌شود -->
            <tbody id="leaderboard-body">
                <tr class="status-row">
                    <td colspan="3">در حال بارگذاری جدول امتیازات...</td>
                </tr>
            </tbody>
        </table>
    </div>    
</div>

<script src="js/qrcode.min.js"></script>
<script src="js/qrcode.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/timer.js"></script>
</body>
</html>
